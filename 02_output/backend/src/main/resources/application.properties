spring.application.name=registration-backend

# Business settings (project/00_setup/environments.md, AR-04); defaults only here, never in code
app.conference-tz=${APP_CONFERENCE_TZ:Europe/Ljubljana}
app.early-bird-deadline=${APP_EARLY_BIRD_DEADLINE:2026-07-31}
app.fee-early=${APP_FEE_EARLY:240.00}
app.fee-regular=${APP_FEE_REGULAR:300.00}
app.vat-rate=${APP_VAT_RATE:0.22}
app.workshops=${APP_WORKSHOPS:W1=Requirements engineering for AI coding agents;W2=Data spaces in practice;W3=Secure software supply chains}
app.rate-limit-per-hour=${APP_RATE_LIMIT_PER_HOUR:100}
app.test-clock=${APP_TEST_CLOCK:disabled}
app.mail-from=${APP_MAIL_FROM:registration@confreg.local}

# Secrets: no defaults (ES-01); startup fails when they are missing
app.organizer.username=${ORGANIZER_USERNAME}
app.organizer.password=${ORGANIZER_PASSWORD}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_MAIL_HOST and SPRING_MAIL_PORT
# bind to spring.datasource.* and spring.mail.* directly

# Persistence (AR-05, AR-06)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

# Mail (AR-07)
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.starttls.enable=${APP_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# HTTP; TLS terminates at the reverse proxy (SB-04, SR-03)
server.port=8080
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.web.resources.add-mappings=false

# Health and readiness on the internal management port (NFR-02, ES-09, D-26)
management.server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.readiness.include=readinessState,db

# No personal data or SQL in logs (SR-01)
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.jpa.show-sql=false
