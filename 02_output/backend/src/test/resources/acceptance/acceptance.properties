# Configuration for the acceptance tests (docs/02_specification.md section 2).
# Business values deliberately differ from the production defaults, so a
# hard-coded default in the code fails these tests (AR-04). Tests read every
# expected value from this configuration, never from literals.
app.conference-tz=Europe/Ljubljana
app.early-bird-deadline=2026-05-15
app.fee-early=180.00
app.fee-regular=260.00
app.vat-rate=0.095
app.workshops=A1=Alpha workshop;B2=Beta workshop
app.rate-limit-per-hour=100000
app.test-clock=enabled
app.mail-from=registration@confreg.test
app.mail-tls=false
