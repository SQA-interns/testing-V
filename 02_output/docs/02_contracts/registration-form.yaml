# Contract: registration form (participant <-> frontend), interface "Registration form".
# Source: AC-001-14, AC-001-15, AR-01, AR-04, D-14; docs/02_specification.md section 7.
# Element names are the accessible names tests use (role + name); they are part of the contract.
contract: registration-form
version: 1.0.0
page:
  path: /
  title: Conference registration
  language: en
  single_page: true
runtime_config:
  source: GET /config.js (same origin), sets window.APP_CONFIG before the application script runs
  shape:
    workshops: "list of {id, title} objects, from APP_WORKSHOPS (format id=title;id=title;...)"
  produced_by:
    container: generated at container start from the APP_WORKSHOPS environment variable
    dev_server: generated by the Vite dev server from APP_WORKSHOPS
  rule: workshop ids and titles are never hard-coded in the frontend (AR-04)
form:
  name: Registration
  fields:
    - {name: firstName, role: textbox, label: First name, required: true, maxLength: 100}
    - {name: lastName, role: textbox, label: Last name, required: true, maxLength: 100}
    - {name: email, role: textbox, label: E-mail, input_type: email, required: true, maxLength: 254}
    - name: payerType
      role: radiogroup
      label: Payer
      options:
        - {value: private, label: Private person, default: true}
        - {value: company, label: Company}
    - {name: companyName, role: textbox, label: Company name, shown_when: payerType = company, maxLength: 200}
    - {name: companyAddress, role: textbox, label: Company address, shown_when: payerType = company, maxLength: 500}
    - {name: companyVatId, role: textbox, label: VAT ID, shown_when: payerType = company, maxLength: 30}
    - name: workshops
      role: radiogroup
      label: Workshop
      options: one radio per configured workshop (label = title), plus "No workshop" (default)
      sends: '[] for "No workshop", otherwise [id]'
  submit:
    role: button
    label: Register
    request: POST /api/registrations, Content-Type application/json, body per registration-api.openapi.yaml
    company_fields_sent: only when payerType = company
    while_pending: button disabled
states:
  success:
    when_status: 201
    region: {role: status, name: "Registration confirmed"}
    shows:
      - Registration number {registrationNumber}
      - Net fee {netFee} EUR
      - VAT {vat} EUR
      - Gross fee {grossFee} EUR
      - A confirmation e-mail has been sent to {email}.
    form: hidden
  validation_error:
    when_status: 422
    per_field: error text rendered next to the field and linked via aria-describedby; field aria-invalid=true
    unknown_field_errors: shown in the general alert
    values: kept as entered
    shows_registration_number: false
  rate_limited:
    when_status: 429
    region: {role: alert}
    text: Too many registrations from your network. Please try again later.
  other_error:
    when_status: any other status or network failure
    region: {role: alert}
    text: Registration failed. Please try again later.
    internal_details: never shown (SB-07)
security:
  output: all user and server values rendered as text (React escaping), no innerHTML (SB-05)
  headers: served with Content-Security-Policy, X-Content-Type-Options, X-Frame-Options/frame-ancestors (SB-10)
