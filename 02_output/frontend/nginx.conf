# Serves the registration form and proxies /api/ to the backend (AR-01).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  # Access log without query strings or bodies (SR-01).
  log_format minimal '$remote_addr [$time_iso8601] "$request_method $uri" $status';
  access_log /dev/stdout minimal;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 16k;

    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    # No add_header here: it would replace the server-level security headers.
    location = /config.json {
      alias /tmp/confreg/config.json;
      default_type application/json;
      expires -1;
    }

    location /api/ {
      proxy_pass http://backend:8080;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
