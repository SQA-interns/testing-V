# nginx for the frontend container (spec 7): static files, /config.js, /api proxy to the backend.
# Runs as the unprivileged nginx user on port 8080 (SB-11).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # No query strings or bodies in the access log (SR-01).
  log_format minimal '$remote_addr [$time_local] "$request_method $uri" $status';
  access_log /dev/stdout minimal;

  # Keep the scheme of an outer TLS proxy (production) so the backend sees HTTPS (SR-03).
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 16k;

    # SB-10
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Runtime configuration: always revalidated. "expires" (not add_header) keeps the server-level
    # security headers inherited.
    location = /config.js {
      expires -1;
    }

    location /api/ {
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
