# Local stack (project/00_setup/environments.md, "local"): plain HTTP on 127.0.0.1 only.
# Run from 02_output/:  docker compose --env-file ../.env up --build
# Settings not set in ../.env keep the defaults of backend/src/main/resources/application.properties.
name: confreg

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: confreg
      POSTGRES_USER: confreg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confreg -d confreg"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/confreg
      SPRING_DATASOURCE_USERNAME: confreg
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ORGANIZER_USERNAME: ${ORGANIZER_USERNAME:?set ORGANIZER_USERNAME in .env}
      ORGANIZER_PASSWORD: ${ORGANIZER_PASSWORD:?set ORGANIZER_PASSWORD in .env}
      # business settings: passed through only when set in ../.env or the shell,
      # otherwise the defaults of application.properties apply
      APP_CONFERENCE_TZ:
      APP_EARLY_BIRD_DEADLINE:
      APP_FEE_EARLY:
      APP_FEE_REGULAR:
      APP_VAT_RATE:
      APP_WORKSHOPS:
      APP_RATE_LIMIT_PER_HOUR:
      APP_TEST_CLOCK:
      APP_MAIL_FROM:
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
